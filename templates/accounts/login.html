{% extends "base_auth.html" %}
{% load static %}
{% block content %}
<div class="min-h-screen relative">

  <!-- Background image -->
  <div class="absolute inset-0">
    <img
      src="{% static 'img/Gemini_login.png' %}"
      class="w-full h-full object-cover"
      alt="Fitness background"
    />
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/40"></div>
  </div>

  <!-- Centered login card -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 -mt-10">


    <div class="w-full max-w-sm bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/15">

      <!-- Header -->
      <div class="flex flex-col items-center py-8 px-6">
        <img
          src="{% static 'images/loginprofile.png' %}"
          alt="Itzamma Fitness"
          class="w-20 h-20 mx-auto mb-5 drop-shadow-[0_10px_30px_rgba(0,255,140,0.35)]"
        />
        <h1 class="text-2xl font-extrabold text-white">Itzamma Fitness</h1>
        <p class="text-sm text-slate-300 mt-2 text-center">
          Inicia sesión para continuar tu camino al mejor entrenamiento
        </p>
      </div>

      <!-- Form -->
      <div class="px-5 pb-6">
        <form method="POST" action="{% url 'login' %}" class="space-y-4">
          {% csrf_token %}

          <!-- Usuario -->
          <div>
            <label class="text-sm text-slate-300 block mb-2">Usuario</label>
            <input
              name="username"
              type="text"
              required

              class="w-full bg-white/90 text-[#0b1220] border border-white/30 rounded-lg px-4 py-3 focus:ring-2 focus:ring-emerald-400"

              placeholder="you@example.com"
            />
          </div>

          <!-- Password -->
          <div>
            <label class="text-sm text-slate-300 block mb-2">Password</label>
            <input
              name="password"
              type="password"
              required
              class="w-full bg-[#0b1220] text-slate-100 border border-[#1f2937] rounded-lg px-4 py-3 focus:ring-2 focus:ring-emerald-400"
              placeholder="Enter your password"
            />
          </div>

          <!-- Row -->
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-slate-300">
              <input type="checkbox" class="accent-emerald-400">
              Remember me
            </label>
            <a href="#" class="text-emerald-300 hover:underline">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full py-3 rounded-lg bg-emerald-400 text-[#052018] font-semibold hover:bg-emerald-500 transition"
          >
            Sign In
          </button>

          <!-- Footer -->
          <p class="text-center text-sm text-slate-400 mt-3">
            ¿No tienes una cuenta?
            <a href="#" class="text-emerald-300 font-semibold hover:underline">
              Regístrate
            </a>
          </p>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
