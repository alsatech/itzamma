{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bienvenido | Itzamma Fitness</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: linear-gradient(180deg, #0a0f1f 0%, #05080f 100%);
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: white;
        text-align: center;
    }

    .hero {
        padding-top: 40px;
        padding-left: 20px;
        padding-right: 20px;
    }

    .hero h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 6px;
    }

    .hero p {
        font-size: 15px;
        color: #c9c9c9;
    }

    .hero-img {
        width: 90%;
        max-width: 380px;
        margin: 30px auto;
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,255,140,0.15);
    }

    .hero-img img {
        width: 100%;
        display: block;
    }

    .actions {
        padding: 30px 20px;
        margin-bottom: 40px;
    }

    .btn-primary {
        display: block;
        width: 100%;
        padding: 16px;
        background: #39ff88;
        color: #04130b;
        font-size: 18px;
        font-weight: 700;
        text-decoration: none;
        border-radius: 14px;
        margin-bottom: 12px;
        box-shadow: 0 12px 25px rgba(57,255,136,0.25);
        transition: 0.25s;
    }

    .btn-primary:active {
        transform: scale(0.97);
    }

    .btn-secondary {
        display: block;
        width: 100%;
        padding: 14px;
        border: 2px solid #39ff88;
        background: transparent;
        color: #39ff88;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 14px;
        transition: 0.3s;
    }

    .btn-secondary:hover {
        background: rgba(57,255,136,0.1);
    }
    .btn-login {
        display: block;
        width: 55%;
        margin: 0 auto 12px auto;

        background: #5BFF7E;
        color: #001b12;

        padding: 12px 0;
        border-radius: 22px;

        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        text-align: center;

        box-shadow: 0 4px 14px rgba(91, 255, 126, 0.4);
        transition: 0.2s ease;
    }
    .btn-login:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 18px rgba(91, 255, 126, 0.55);
    }

    .btn-contact {
        display: block;
        width: 55%;
        margin: 0 auto;

        background: transparent;
        border: 2px solid #5BFF7E;
        color: #5BFF7E;

        padding: 10px 0;
        border-radius: 22px;

        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        text-align: center;

        transition: 0.2s ease;
    }
    .btn-contact:hover {
        background: rgba(91, 255, 126, 0.12);
        transform: scale(1.03);
    }
</style>

</head>
<body>

    <div class="hero">
        <h1>Tu mejor versión empieza aquí</h1>
        <p>Entrena inteligente. Consigue resultados reales.</p>
    </div>

    <div class="hero-img">
        <img src="https://images.unsplash.com/photo-1599058917212-d750089bc07e?auto=format&q=80&w=800"
             alt="Fitness Image">
    </div>

    <div class="actions">
        <a href="{% url 'login' %}" class="btn-login">Iniciar sesión</a>
        <a href="#" class="btn-contact">Contacto</a>
    </div>


</body>
</html>
