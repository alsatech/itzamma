{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itzamma Fitness</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        font-family: 'Inter', sans-serif;
        background-image: url("{% static 'img/itzamnafit.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
        color: white;
        overflow: hidden;
    }

    /* OVERLAY OSCURO */
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(
                180deg,
                rgba(0,0,0,0.55) 0%,
                rgba(0,0,0,0.75) 70%,
                rgba(0,0,0,0.9) 100%
            );
        z-index: 0;
    }

    /* BOTÓN LOGIN (ARRIBA DERECHA) */
    .btn-login {
        position: fixed;
        top: 22px;
        right: 22px;
        z-index: 2;

        padding: 10px 18px;
        border-radius: 20px;

        background: linear-gradient(90deg, #39ff88, #22c55e);
        border: none;
        box-shadow: 0 8px 22px rgba(57,255,136,0.45);

        color: #02140b;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        backdrop-filter: blur(6px);
    }

    /* TEXTO CENTRAL */
    .headline {
        position: absolute;
        bottom: 190px;
        left: 22px;
        right: 22px;
        z-index: 2;
    }

    .headline h1 {
        font-size: 32px;
        font-weight: 900;
        line-height: 1.15;
        margin-bottom: 8px;
    }

    .headline p {
        font-size: 15px;
        color: #d1d5db;
        max-width: 320px;
    }

    /* BOTÓN NOSOTROS (ABAJO) */
    .btn-about {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;

        padding: 14px 32px;
        border-radius: 30px;

        background: rgba(0,0,0,0.65);
        border: 2px solid #39ff88;

        color: #39ff88;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;

        backdrop-filter: blur(6px);
    }

</style>
</head>

<body>

    <!-- LOGIN -->
    <a href="{% url 'login' %}" class="btn-login">
        Iniciar sesión
    </a>

    <!-- TEXTO -->
    <div class="headline">
        <h1>Entrena fuerte.<br>Entrena inteligente.</h1>
        <p>Programas reales. Resultados medibles. Rendimiento total.</p>
    </div>

    <!-- NOSOTROS -->
    <a href="#" class="btn-about">
        Nosotros
    </a>

</body>
</html>
