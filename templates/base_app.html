{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Itzamma Fitness{% endblock %}</title>

    <!-- ESTILOS GLOBALES (sin Tailwind) -->
    <style>
        body {
            margin: 0;
            padding: 0 0 90px 0; /* espacio para el menú inferior */
            min-height: 100vh;
            background: #f6f6f9;
            font-family: 'Inter', sans-serif;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
        }

        main {
            padding: 16px;
            padding-bottom: 40px;
        }

        /* MENU INFERIOR */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            z-index: 9999;
        }

        nav.bottom-nav a {
            text-decoration: none;
            color: #555;
            font-size: 12px;
        }

        nav.bottom-nav span.icon {
            font-size: 22px;
            display: block;
            margin-bottom: 2px;
        }

        /* Activo */
        nav.bottom-nav a.active {
            color: #4a6cf7;
            font-weight: 600;
        }
    </style>

</head>

<body>

    <!-- HEADER SUPERIOR -->
    <header>
        <span>{% block header_title %}Itzamma Fitness{% endblock %}</span>

        {% if user.is_authenticated and user.foto %}
            <img src="{{ user.foto.url }}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        {% else %}
            <div style="width:40px; height:40px; border-radius:50%; background:#ccc;"></div>
        {% endif %}
    </header>

    <!-- CONTENIDO -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- MENÚ INFERIOR -->
    <nav class="bottom-nav">
        {% if user.rol == "cliente" %}
            <a href="/profiles/dashboard/" class="{% if request.path == '/profiles/dashboard/' %}active{% endif %}">
                <span class="icon">🏠</span>
                Inicio
            </a>

            <a href="/profiles/rutinas/" class="{% if 'rutina' in request.path %}active{% endif %}">
                <span class="icon">🏋️</span>
                Rutinas
            </a>

            <a href="{% url 'perfil' %}" class="{% if 'mi-perfil' in request.path %}active{% endif %}">

                <span class="icon">👤</span>
                Perfil
            </a>

        {% endif %}
    </nav>

</body>
</html>
