<div
  class="day-card"
  style="
    min-width: 320px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
    border-radius: 24px;
    padding: 20px;
    box-shadow:
      {% if day.is_today %}
        0 0 40px rgba(34,197,94,0.35)
      {% else %}
        0 10px 30px rgba(0,0,0,0.55)
      {% endif %};
    border:
      {% if day.is_today %}
        1px solid #22c55e
      {% else %}
        1px solid rgba(255,255,255,0.08)
      {% endif %};
  "
>

  <!-- DAY BADGE + TODAY -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <span
      style="
        background: {% if day.is_today %}#22c55e{% else %}#334155{% endif %};
        color: #020617;
        font-weight: 900;
        font-size: 12px;
        padding: 6px 16px;
        border-radius: 999px;
        letter-spacing: 0.04em;
      "
    >
      DIA {{ day.day_number }}
    </span>

    {% if day.is_today %}
      <span style="color:#22c55e;font-weight:900;font-size:12px;">
        HOY
      </span>
    {% endif %}
  </div>

  <!-- DAY NAME -->
  <h2
    style="
      color: white;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    "
  >
    {{ day.day }}
  </h2>

  <!-- CONTENT -->
  {% if day.assignments %}
    {% for a in day.assignments %}
      <div
        style="
          background: rgba(255,255,255,0.04);
          border-radius: 16px;
          padding: 14px 16px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
          transition: background 0.2s ease;
        "
      >
        <a href="{% url 'detalle_rutina' a.assignment.id %}"
           style="color:white;font-weight:700;font-size:14px;text-decoration:none;">
          {{ a.rutina.nombre }}
        </a>

        {% if a.completed %}
          <span style="color:#22c55e;font-weight:900;font-size:16px;">
            ✓
          </span>
        {% else %}
          <span style="color:#64748b;font-size:18px;">
            •
          </span>
        {% endif %}
      </div>
    {% endfor %}
  {% else %}
    <p
      style="
        color: #64748b;
        font-weight: 700;
        font-size: 14px;
        padding-top: 8px;
      "
    >
      Descanso y Recuperacion
    </p>
  {% endif %}

</div>
