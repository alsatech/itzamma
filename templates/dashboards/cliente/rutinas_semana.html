{% extends "base_app.html" %}
{% block content %}

<div class="min-h-screen">

  <!-- Header -->
  <div class="sticky top-0 z-10 backdrop-blur-xl border-b border-zinc-800" style="background:rgba(13,17,23,0.8)">
    <div class="px-5 py-4">
      <h1 class="text-4xl font-black text-white">Plan Semanal</h1>
      <p class="text-zinc-400 text-sm">
        Tu plan de entrenamiento personalizado
      </p>
    </div>
  </div>

  <!-- Horizontal scroll -->
  <div class="overflow-x-auto px-5 py-6 hide-scrollbar">
    <div class="flex gap-5 pb-4">
    {% for day in week_schedule %}
      {% include "dashboards/cliente/day_card.html" with day=day %}
    {% endfor %}

    </div>
  </div>

</div>

{% endblock %}
