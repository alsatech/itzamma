{% extends "base_app.html" %}
{% block title %}Asignar Rutina{% endblock %}
{% block header_title %}Asignar Rutina{% endblock %}

{% block content %}

<div style="
    max-width: 480px;
    margin: 0 auto;
    padding: 24px;
    color: #e5e7eb;
">

    <!-- TÍTULO -->
    <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">
        Asignar rutina:
        <span style="color: #22c55e;">{{ workout.titulo }}</span>
    </h2>

    <p style="color: #9ca3af; font-size: 14px; margin-bottom: 24px;">
        Selecciona un cliente para asignarle esta rutina.
    </p>

    <!-- CARD -->
    <div style="
        background: #111827;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        border: 1px solid rgba(255,255,255,0.05);
    ">

        <form method="POST">
            {% csrf_token %}

            <label style="display: block; margin-bottom: 8px; font-size: 15px; color: #d1d5db;">
                Seleccionar cliente:
            </label>

            <select name="cliente" style="
                width: 100%;
                padding: 12px;
                border-radius: 12px;
                background: #1f2937;
                border: 1px solid #374151;
                color: #e5e7eb;
                margin-bottom: 20px;
                font-size: 15px;
            ">
                {% for c in clientes %}
                    <option value="{{ c.id }}">{{ c.username }}</option>
                    
                {% endfor %}
            </select>


            <button type="submit" style="
                width: 100%;
                background: linear-gradient(90deg, #22c55e, #16a34a);
                padding: 14px;
                border-radius: 12px;
                color: #022c22;
                font-weight: 700;
                font-size: 15px;
                box-shadow: 0 8px 25px rgba(34,197,94,0.35);
                cursor: pointer;
                transition: 0.2s;
            "
            onmouseover="this.style.transform='scale(1.02)'"
            onmouseout="this.style.transform='scale(1)'">
                ✓ Asignar rutina
            </button>

        </form>
    </div>

</div>

{% endblock %}
